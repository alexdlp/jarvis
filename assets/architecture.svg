  <rect width="1600" height="760" fill="#ffffff"/>
  <text class="title" x="800" y="48" text-anchor="middle">Jarvis · current AWS architecture</text>

  <!-- AWS boundaries -->
  <rect x="400" y="82" width="1140" height="606" rx="6" fill="#ffffff" stroke="#232f3e" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="424" y="107" width="1092" height="557" rx="4" fill="#f8fbff" stroke="#147eba" stroke-width="2"/>
  <rect x="420" y="72" width="128" height="28" fill="#ffffff"/>
  <text class="boundary-label" x="432" y="93">AWS Cloud</text>
  <rect x="446" y="97" width="185" height="28" fill="#f8fbff"/>
  <text class="boundary-label" x="456" y="118">Region · eu-west-1</text>

  <!-- User -->
  <g aria-label="User">
    <circle cx="74" cy="289" r="28" fill="#fff" stroke="#545b64" stroke-width="3"/>
    <path d="M25 382C25 338 45 318 74 318C103 318 123 338 123 382" fill="#fff" stroke="#545b64" stroke-width="3"/>
    <text class="service" x="74" y="416" text-anchor="middle">User</text>
  </g>

  <!-- MCP client -->
  <g aria-label="MCP client">
    <rect x="184" y="255" width="166" height="112" rx="6" fill="#fff" stroke="#545b64" stroke-width="3"/>
    <rect x="199" y="270" width="136" height="73" rx="2" fill="#eef4fa" stroke="#545b64" stroke-width="2"/>
    <path d="M238 382H296M251 367V382M283 367V382" fill="none" stroke="#545b64" stroke-width="3" stroke-linecap="round"/>
    <text class="service" x="267" y="416" text-anchor="middle">MCP client</text>
    <text class="detail" x="267" y="438" text-anchor="middle">Claude or any MCP agent</text>
  </g>

  <!-- AWS services -->
  <g aria-label="Amazon API Gateway">
    <use href="#aws-api-gateway" x="572" y="247" width="96" height="96"/>
    <text class="service" x="620" y="373" text-anchor="middle">Amazon API Gateway</text>
    <text class="detail" x="620" y="395" text-anchor="middle">HTTP API · $default stage</text>
    <text class="route" x="620" y="425" text-anchor="middle">GET /.well-known/.../mcp  [public]</text>
    <text class="route" x="620" y="448" text-anchor="middle">ANY /mcp  [JWT authorizer]</text>
  </g>

  <g aria-label="AWS Lambda">
    <use href="#aws-lambda" x="932" y="247" width="96" height="96"/>
    <text class="service" x="980" y="373" text-anchor="middle">AWS Lambda</text>
    <text class="detail" x="980" y="395" text-anchor="middle">Jarvis MCP server</text>
    <text class="detail" x="980" y="416" text-anchor="middle">Python 3.13 · arm64</text>
    <text class="detail" x="980" y="437" text-anchor="middle">Stateless HTTP · JSON</text>
  </g>

  <g aria-label="Amazon CloudWatch">
    <use href="#aws-cloudwatch" x="1282" y="247" width="96" height="96"/>
    <text class="service" x="1330" y="373" text-anchor="middle">Amazon CloudWatch</text>
    <text class="detail" x="1330" y="395" text-anchor="middle">API Gateway access logs</text>
    <text class="detail" x="1330" y="416" text-anchor="middle">Lambda function logs</text>
    <text class="detail" x="1330" y="437" text-anchor="middle">14-day retention</text>
  </g>

  <g aria-label="Amazon Cognito">
    <use href="#aws-cognito" x="572" y="510" width="96" height="96"/>
    <text class="service" x="620" y="633" text-anchor="middle">Amazon Cognito</text>
    <text class="detail" x="620" y="653" text-anchor="middle">User Pool · hosted login</text>
  </g>

